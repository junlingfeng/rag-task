# 真实模型配置示例：把 key 通过环境变量或 .env 注入，不要把 key 写进本文件。
#
# 用法：
#   1) cp .env.example .env  （填入 OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL）
#   2) uv run python scripts/ask.py "员工每年有多少天年假？" --config configs/openai_example.yaml
#
# 优先级：环境变量 > 本文件 > configs/base.yaml
# 也就是说 .env 里的 OPENAI_BASE_URL / OPENAI_MODEL 会覆盖下面的 base_url / model，
# 国内模型直接改 .env 即可，不必改本文件。
#
# 只覆盖需要改动的字段，其余继承 configs/base.yaml。
app:
  config_version: c3_openai

generation:
  backend: openai
  model: gpt-4o-mini                  # 可被 OPENAI_MODEL 覆盖
  base_url: https://api.openai.com/v1 # 可被 OPENAI_BASE_URL 覆盖
  api_key_env: OPENAI_API_KEY         # 环境变量名，可自定义
  base_url_env: OPENAI_BASE_URL       # 设为 null 则禁用地址覆盖
  model_env: OPENAI_MODEL             # 设为 null 则禁用模型覆盖
  temperature: 0
  max_output_tokens: 600
  max_tokens_field: max_tokens        # 新版 OpenAI 推理模型改为 max_completion_tokens
  timeout_seconds: 30
  fallback_to_offline: false          # 评测时建议 false：key 配错直接报错，而不是静默降级
  # 价格必须替换为官方当期价格（美元 / 1M token），否则成本报告失真
  price_in_per_1m: 0.15
  price_out_per_1m: 0.60
