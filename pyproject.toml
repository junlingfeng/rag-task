[project]
name = "rag-service"
version = "0.1.0"
description = "Multi-turn RAG QA + generative service over a bilingual internal knowledge base"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "pymupdf>=1.28.2",
    "pillow>=12.3.0",
    "tokenizers>=0.23.2",
    "huggingface-hub>=1.32.0",
]

[project.optional-dependencies]
# 真实模型/OCR/向量库依赖。离线环境可不装，代码会自动降级到内置实现。
models = [
    "sentence-transformers>=3.0",
]
ocr = [
    # onnxruntime >= 1.21 已不再提供 macOS x86_64 wheel，此处固定到最后一个可得版本
    "onnxruntime>=1.17,<1.21",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python-headless>=4.9,<4.11",
    "Pillow>=10.0",
]
stores = [
    "qdrant-client>=1.10",
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
